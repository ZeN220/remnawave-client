name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src tests tools examples
      - run: uv run ruff format --check src tests tools examples
      - run: uv run mypy

  tests:
    name: Tests ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 3.15 is not released yet, so it must not block merges
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest

  codegen:
    name: Generated code matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python -m tools.codegen
      - name: No drift
        run: git diff --exit-code src/remnawave/_generated src/remnawave/types
