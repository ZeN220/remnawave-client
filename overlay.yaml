groups:
  "[Public] Subscription Controller": subscription
  "[Protected] Subscriptions Controller": subscriptions

methods:
  NodesUsageHistoryController_getStatsNodesUsage: get_nodes_usage  # conflict with BandwidthStatsUsersController_getStatsNodesUsage

# Type names the generator got wrong. Its rule — shortest candidate, leading
# verb and repeated words dropped — is right almost everywhere.
types:
  # Its only candidate is taken by the real User; a digit says nothing.
  User2: UserRef

  # Wrapper took its element's name (hint Passkey + field passkeys). Element
  # gets it back, wrapper goes plural like Users and GetPasskeysResponseDto.
  Passkey: Passkeys
  PasskeyPasskey: Passkey
  Snippet: Snippets
  SnippetSnippet: Snippet

  # An event model and its own event field want one name, so one needs a
  # suffix. The model keeps the plain one.
  CrmEventEvent: CrmEventName
  NodeEventEvent: NodeEventName
  ServiceEventEvent: ServiceEventName
  UserEventEvent: UserEventName
  UserHwidDevicesEventEvent: UserHwidDevicesEventName

  # Unrelated endpoints share an anonymous shape. Merging is right, but the
  # name comes from whichever sorts first and so points at a stranger.
  GeocheckByNode: JobRef             # {jobId}, also connections by user/node
  HostsTags: Tags                    # {tags} of nine listings
  ReorderHostsBodyHost: ReorderItem  # {viewPosition, uuid} of eight reorders
  ReorderNodePluginsBody: ReorderBody

secret_fields:
  User:
    - trojanPassword
    - ssPassword
    - vlessUuid
    - subscriptionUrl

# Fractional values the panel declares as a plain number. Checked against
# remnawave/backend 3.4.4 and remnawave/node: only what a division, an average
# or a Float column can reach is listed here, the rest of the numbers are whole.
field_types:
  # fromNanoToNumber() of the stored nano value.
  consumptionMultiplier: float
  nodeConsumptionMultiplier: float
  # os.uptime(), process.uptime(), event loop delay in ms.
  uptime: float
  eventLoopDelayMs: float
  eventLoopP99Ms: float
  # Node system stats: os.loadavg() and a byte delta over elapsed seconds.
  loadAvg: list[float]
  rxBytesPerSec: float
  txBytesPerSec: float
  # Devices over users, rounded to two decimals.
  averageHwidDevicesPerUser: float
  # Notification thresholds come from env as z.array(z.number()) with no
  # integer bound: BANDWIDTH_USAGE_NOTIFICATIONS_THRESHOLD holds ratios like
  # 0.8, and nothing stops half an hour or half a day in the other two.
  bandwidthUsage: list[float]
  notConnectedAfter: list[float]
  expirationNotifications: list[float]
  # The same env values, as the webhook meta of a single notification.
  notConnectedAfterHours: float
  expiration: float
  # Infra billing money: a Float column and round(sum(amount)::numeric, 2).
  amount: float
  totalAmount: float
  totalSpent: float
  currentMonthPayments: float

# snake() would turn HWID into h_w_i_d.
field_names:
  HWIDMaxDevicesExceeded: hwid_max_devices_exceeded
  HWIDNotSupported: hwid_not_supported
