groups:
  "[Public] Subscription Controller": subscription
  "[Protected] Subscriptions Controller": subscriptions

methods:
  NodesUsageHistoryController_getStatsNodesUsage: get_nodes_usage  # conflict with BandwidthStatsUsersController_getStatsNodesUsage

# Имена типов. Ключ — авто-имя, которое выбрал генератор.
# Авто-правило (самое короткое имя-кандидат без ведущего глагола) даёт
# осмысленный результат почти везде; здесь только то, где оно промахнулось.
types:
  # Единственный кандидат занят настоящим User, а цифра рядом с ним
  # ничего не объясняет. Форма — {id, username, shortUuid}.
  User2: UserRef

  # Обёртка заняла имя элемента: хинт Passkey плюс поле passkeys даёт
  # PasskeyPasskey. Имя возвращаем элементу, обёртку ставим во
  # множественное число — как в спеке и как у прочих листингов.
  Passkey: Passkeys
  PasskeyPasskey: Passkey
  Snippet: Snippets
  SnippetSnippet: Snippet

  # Поле event у вебхука — это имя события. Модель события и её поле
  # хотят одно имя, суффикс обязан быть у кого-то из двух: оставляем
  # хорошее имя модели.
  CrmEventEvent: CrmEventName
  NodeEventEvent: NodeEventName
  ServiceEventEvent: ServiceEventName
  UserEventEvent: UserEventName
  UserHwidDevicesEventEvent: UserHwidDevicesEventName

secret_fields:
  User:
    - trojanPassword
    - ssPassword
    - vlessUuid
    - subscriptionUrl

# Принудительный тип поля там, где спека его не выражает.
# Множители дробные, хотя объявлены как number. В 3.4.3 у expireAt
# пропал format: date-time, хотя панель по-прежнему ждёт ISO-дату.
field_types:
  consumptionMultiplier: float
  nodeConsumptionMultiplier: float
  uptime: float
  eventLoopDelayMs: float
  eventLoopP99Ms: float

field_names:
  HWIDMaxDevicesExceeded: hwid_max_devices_exceeded
  HWIDNotSupported: hwid_not_supported
  media_type: media_type
